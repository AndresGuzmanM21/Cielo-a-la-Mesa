<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <!-- Para que la pagina se adapte al celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cielo a la Mesa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  

  <!-- Conectamos el CSS -->
  <link rel="stylesheet" href="/css/carruceles.css">
  <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

  <!-- INICIO DE LA BARRA DE NAVEGACION -->
  <header class="nav-flotante">

    <!-- Boton hamburguesa -->
    <button
      class="hamburguesa"
      id="hamburguesa"
      aria-label="Abrir menú"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Logo centrado -->
    <a href="#inicio" class="logo">
      <img
        src="./imagenes/logo.png"
        alt="Logo de Cielo a la Mesa"
      >
    </a>

    <!-- Este espacio ayuda a centrar el logo -->
    <div class="espacio"></div>

    <!-- Menu que se abre con la hamburguesa -->
    <nav class="menu-desplegable" id="menuDesplegable">

      <a href="#inicio">Inicio</a>

      <a href="#carrito">Carrito</a>

      <a href="#comida">Comida</a>

      <a href="#bebidas">Bebidas</a>

      <a href="#postres">Postres</a>

    </nav>

  </header>
  <!-- FINAL DE LA BARRA DE NAVEGACION -->

  <!--CARRUCELES-->

  <section class="carrules">
    <section class="carrucel1">

      <div id="carouselExampleIndicators" class="carousel slide carousel-fade" data-bs-ride="carousel">
        <div class="carousel-indicators">
          <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active"
            aria-current="true" aria-label="Slide 1"></button>
          <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"
            aria-label="Slide 2"></button>
          <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"
            aria-label="Slide 3"></button>
        </div>
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="https://images.unsplash.com/photo-1508471349025-ca3e278cf5e2?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" class="d-block w-100" alt="...">
          </div>
          <div class="carousel-item">
            <img src="https://images.unsplash.com/photo-1651980927610-434846437c28?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" class="d-block w-100" alt="...">
          </div>
          <div class="carousel-item">
            <img src="https://images.unsplash.com/photo-1667780905058-87fc5995ed6a?q=80&w=1331&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" class="d-block w-100" alt="...">
          </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators"
          data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators"
          data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>

    </section>

    


  <!--FIN CARRUCEL 1-->


  <!-- CONTENIDO DE LA PAGINA -->
  <main class="contenido-pagina">

    <section class="seccion" id="inicio">
      <h1>Cielo a la Mesa</h1>

      <p>
        Alta cocina, donde estés.
      </p>
    </section>


    <section class="seccion fondo-azul" id="carrito">
      <h2>Carrito</h2>

      <p>
        Aquí aparecerán los productos agregados.
      </p>
    </section>


    <section class="seccion" id="comida">
      <h2>Comida</h2>

      <p>
        Aquí colocaremos los platos principales.
      </p>
    </section>


    <section class="seccion fondo-azul" id="bebidas">
      <h2>Bebidas</h2>

      <p>
        Aquí colocaremos las bebidas.
      </p>
    </section>


    <section class="seccion" id="postres">
      <h2>Postres</h2>

      <p>
        Aquí colocaremos los postres.
      </p>
    </section>

    <!--CARRUCEL2-->

    <section class="carrucel2">

      <div id="divcarousel2" class="carousel slide carousel-fade" data-bs-ride="carousel">
        <div class="carousel-indicators">
          <button type="button" data-bs-target="#divcarousel2" data-bs-slide-to="0" class="active"
            aria-current="true" aria-label="Slide 1"></button>
          <button type="button" data-bs-target="#divcarousel2" data-bs-slide-to="1"
            aria-label="Slide 2"></button>
          <button type="button" data-bs-target="#divcarousel2" data-bs-slide-to="2"
            aria-label="Slide 3"></button>
        </div>
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="https://images.unsplash.com/photo-1669722115140-d314341ab05d?q=80&w=1141&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" class="d-block w-100" alt="...">
          </div>
          <div class="carousel-item">
            <img src="https://plus.unsplash.com/premium_photo-1714247709018-3df125620516?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" class="d-block w-100" alt="...">
          </div>
          <div class="carousel-item">
            <img src="https://images.unsplash.com/photo-1677758779483-aba6b34e5dfd?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" class="d-block w-100" alt="...">
          </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#divcarousel2"
          data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#divcarousel2"
          data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>




    </section>



  </section>

  <!--FIN CARRUCEL 2-->




    









  

  </main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <!-- Conectamos JavaScript -->
  <script src="./js/script.js"></script>

</html>
